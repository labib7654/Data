name: Build APK

on:
  push:
    paths:
      - '**.zip'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Unzip project
        run: |
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -1)
          unzip -o "$ZIP" -d project
          echo "PROJECT_DIR=project" >> $GITHUB_ENV

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x ${{ env.PROJECT_DIR }}/gradlew

      - name: Build APK
        run: |
          cd ${{ env.PROJECT_DIR }}
          ./gradlew assembleDebug

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v3
        with:
          name: app-debug
          path: project/app/build/outputs/apk/debug/app-debug.apk

      - name: Commit APK to repo
        run: |
          mkdir -p output
          cp project/app/build/outputs/apk/debug/app-debug.apk output/app-debug.apk
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add output/app-debug.apk
          git commit -m "APK build ready" || echo "Nothing to commit"
          git push
