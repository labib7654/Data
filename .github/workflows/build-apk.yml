name: Build APK

on:
  push:
    paths:
      - '**.zip'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -1)
          unzip -o "$ZIP" -d extracted
          SUBDIR=$(find extracted -maxdepth 2 -name "gradlew" | head -1 | xargs dirname)
          echo "PROJECT_DIR=$SUBDIR" >> $GITHUB_ENV

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download gradle wrapper jar
        run: |
          mkdir -p "${{ env.PROJECT_DIR }}/gradle/wrapper"
          curl -sL "https://github.com/gradle/gradle/raw/v8.11.1/gradle/wrapper/gradle-wrapper.jar" \
            -o "${{ env.PROJECT_DIR }}/gradle/wrapper/gradle-wrapper.jar"

      - name: Make gradlew executable
        run: chmod +x "${{ env.PROJECT_DIR }}/gradlew"

      - name: Build APK
        run: |
          cd "${{ env.PROJECT_DIR }}"
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk"