name: Unzip and Update

on:
  push:
    paths:
      - '**.zip'

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Unzip files
        run: |
          for f in *.zip; do
            unzip -o "$f" -d "${f%.zip}"
          done

      - name: Remove zip files
        run: rm -f *.zip

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Auto unzip" || echo "Nothing to commit"
          git push
